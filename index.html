<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- grid generate inputs -->
<div class="menu">
    <input type="file" id="imageInput" accept="image/*">
    <label>
        <input type="checkbox" id="brickPattern">pattern cegiełkowy
    </label>
    <label>
        <input type="checkbox" id="symbolMode">Tryb Symboli
    </label>
    <label for="widthInput">Szerokość (kolumny):</label>
    <input type="number" id="widthInput" value="10" min="1">
    <label for="heightInput">Wysokość (wiersze):</label>
    <input type="number" id="heightInput" value="10" min="1">
    <button id="generateBtn">Generuj siatkę</button>
    <button id="printBtn">Pobierz PDF</button>

    <!-- slider -->
    <label for="cellSizeSlider">Rozmiar komórek:</label>
    <input type="range" id="cellSizeSlider" min="20" max="50" value="25">
</div>

<hr>

<div class="utils">
<!-- Legend -->
<div id="legendContainer">
    <h3>Legenda</h3>
    <div id="legend"></div>
</div>
<!-- color picker -->
<div id="colorPicker">
    <h3>Wybierz symbol/kolor</h3>
    <div id="symbolsContainer"></div>
</div>
<!-- main wraper generate + numbers -->
<div id="wrapper">
    <div></div> <!-- top left corner empty -->
    <div class="top-numbers"></div> <!-- top -->
    <div class="left-numbers"></div> <!-- left -->
    <div id="grid"></div> <!-- main grid -->
</div>
<br>
<br>
<footer>Designed by: <a href="https://github.com/TheDrem94" target="_blank"><b>TheDrem</b></a> </footer>
    <script src="script.js"></script>
</body>
</html>
